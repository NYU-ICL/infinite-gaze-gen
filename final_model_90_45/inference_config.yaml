# Inference-only translation of logs/config_w_abs_paths.yaml.
# checkpoint_70.pth was trained as the former DINO-conditioned model.  The
# current runtime uses unet_saliency_hires and load_checkpoint() migrates the
# renamed dino_mlp weights to saliency_mlp when loading this checkpoint.
model:
  target: models.unet_saliency_hires.Unet
  params:
    in_channels: 2
    out_channels: 2
    seq_len: 45
    history_len: 90
    pred_len: 45
    data_sample_stride: 135
    down_channels: [32, 64, 128, 256]
    mid_channels: [256, 256, 128]
    time_emb_dim: 128
    down_sample: [true, true, false]
    num_down_layers: 2
    num_mid_layers: 2
    num_up_layers: 2
    num_self_attn_heads_in_unet: 3
    num_cross_attn_heads_pre_unet: 4
    saliency_patches: 64
    saliency_features: 24
    patches_crss_attn_b4_unet: true
    patches_crss_attn_thru_unet: true
    attn_embed_size: 128
    pos_enc_type: sinusoidal_fine
    should_do_pos_enc: false
    frame_stride: 5
    use_frame_conditioning: true
    traj_pos_enc_height: 224
    traj_pos_enc_width: 224

diffusion:
  eval_scheduler:
    target: diffusers.schedulers.DDIMScheduler
    params:
      beta_start: 0.0001
      beta_end: 0.02
      num_train_timesteps: 1000
      clip_sample: false
      set_alpha_to_one: true
    num_inference_steps: 50
    eta: 0.9

dataset:
  history_len: 90
  pred_len: 45
  frame_stride: 5
  stim_w: 224
  stim_h: 224
  saliency_patch_feature_dim: 24
  saliency_patch_token_count: 64
  saliency_patch_dir_name: saliency_unisal_latents_small

train:
  cfg_scale: 4
